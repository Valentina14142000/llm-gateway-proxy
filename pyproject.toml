[project]
name = "llm-gateway-proxy"
version = "0.1.0"
description = "Enterprise-grade multi-tenant LLM proxy with async routing, streaming, and governance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.0",
    "redis>=5.0.3",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "structlog>=24.1.0"
]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "respx>=0.21.1",
    "ruff>=0.2.2",
    "mypy>=1.8.0"
]
